modLoader = "javafml"
loaderVersion = "[4,)"
license = "LGPL-3.0-only"
issueTrackerURL = "https://github.com/Alex-the-666/ice-and-fire/issues"

[[mods]]
modId = "iceandfire"
version = "${mod_version}"
displayName = "Ice and Fire"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/ice-and-fire-dragons"
authors = "Raptorfarian, Alexthe666; Nicktale port by Nicolas"
description = '''Unofficial NeoForge port of Ice and Fire. Dragons and other mythological creatures in Minecraft.'''

[[dependencies.iceandfire]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.iceandfire]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.iceandfire]]
modId = "nicktaleapi"
type = "required"
versionRange = "[${nicktale_api_version},)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "iceandfire.mixins.json"
