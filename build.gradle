plugins {
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'iceandfire-nicktale'
}

repositories {
    mavenCentral()
}

// Migration is done block by block; only listed packages/files compile until the port is complete.
sourceSets {
    main {
        java {
            include 'com/github/alexthe666/iceandfire/client/model/ModelDragonBase.java'
            include 'com/github/alexthe666/iceandfire/client/model/ModelHippogryph.java'
            include 'com/github/alexthe666/iceandfire/client/model/HippogryphRenderState.java'
            include 'com/github/alexthe666/iceandfire/entity/HippogryphAnimations.java'
        }
    }
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation files("../nicktale-api-neoforge/build/libs/nicktaleapi-${nicktale_api_version}.jar")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}
