plugins {
    id 'net.neoforged.moddev' version "${moddevgradle_version}"
    id 'maven-publish'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'iceandfire-nicktale'
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        resources.srcDir 'src/generated-client/resources'
    }
    client {
        java.setSrcDirs(['src/client/java'])
        resources.setSrcDirs(['src/client/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        clientTest {
            client()
            gameDirectory = project.file('runs/client')
            programArguments.addAll '--quickPlaySingleplayer', 'iaftest'
            jvmArguments.add '-Diaf.smoketest=true'
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
        }
        serverData {
            serverData()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--mod', mod_id, '--server', '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
        clientData {
            clientData()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--mod', mod_id, '--client', '--output', file('src/generated-client/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    implementation files("nicktale-api/build/libs/nicktaleapi-${nicktale_api_version}.jar")
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '9000'
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.named('jar', Jar).configure {
    from sourceSets.client.output
}

tasks.named('processResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
